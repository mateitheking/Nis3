[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["apps*"]

[project]
name = "nis-platform"
version = "0.1.0"
description = "Единая платформа НИШ с AI-ассистентом"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28", "pydantic>=2.10", "bcrypt>=4.1", "python-multipart>=0.0.9",
    "openai>=1.50", "python-dotenv>=1.0",
    "fastapi>=0.115", "uvicorn[standard]>=0.30", "sqlalchemy>=2.0",
    "cryptography>=42", "edupage_api>=0.12.5", "curl_cffi>=0.16",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
